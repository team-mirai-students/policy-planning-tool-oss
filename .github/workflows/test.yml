# 自動テスト：GitHub にアップロード（push）するたび・Pull Request のたびに動く
#   unit … 計算まわり（工程の期限・定例の日付・開票など）のテスト
#   e2e  … 実際の画面を動かすテスト（Playwright。テスト用の空のデータベースで動く）
name: test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-planning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate production bundle
        if: github.repository == 'team-mirai-students/policy-planning-tool'
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx wrangler deploy --dry-run --env=""

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # ローカル確認用ログイン（DEV_LOGIN）を使うための設定。秘密の値は入っていない見本
      - run: cp .dev.vars.example .dev.vars
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  deploy:
    name: Deploy production
    needs: [unit, e2e]
    # PRs never deploy. Both automatic and manual deployment require main.
    if: >-
      github.repository == 'team-mirai-students/policy-planning-tool' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize production deployments.
    concurrency:
      group: policy-planning-deploy-production
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
      - run: npm ci
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --env=""
      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply policy-planning --remote --env=""
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env=""
