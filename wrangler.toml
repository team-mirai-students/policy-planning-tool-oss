name = "policy-planning"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# エラーの調査用に、Workerのログを Cloudflare のダッシュボードに残す
# デプロイの版（画面の自動更新に使う）
[version_metadata]
binding = "CF_VERSION"

[observability]
enabled = true

[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/s/*"]

[[d1_databases]]
binding = "DB"
database_name = "policy-planning"
database_id = "<npx wrangler d1 create で出た database_id>"
# 手元の開発用DB（.wrangler の中）は、移行前のIDで作ってあるので、それを使い続ける
preview_database_id = "<npx wrangler d1 create で出た database_id>"
migrations_dir = "migrations"

# 希望PJアンケートとの連動（SURVEY_DB）は外した。PJ決めはツールの中で行う（2026年秋の分は取り込み済み）

# 毎朝 8:00 JST（= 23:00 UTC）にリマインドを送る（次回MTGが未定のPJ、止まっているヒアリング申請）
[triggers]
crons = ["0 23 * * *"]

[vars]
# 通知のDMに入れるリンクの先頭
APP_URL = "https://policy-planning.<アカウント>.workers.dev"
# このDiscordサーバー（学生チーム）のメンバーなら誰でもログインできる
DISCORD_GUILD_ID = ""
# 政策立案部門のロールID。ログインには不要。外部ヒアリングを見られる人（部門メンバー・代表・管理者）の判定に使う
DEPT_ROLE_ID = ""
# 部門長（管理者を兼ねる）・代表は、管理者メニューで選ぶ（DBの heads / reps）。
# ここに書いた人は「固定」になり、管理者メニューから外せない（新しく立ち上げるときの最初の部門長だけに使う）
HEAD_IDS = ""
REP_IDS = ""
# 部門長のほかに、常に管理者にする人の Discord ユーザーID（カンマ区切り。副部門長など）。管理者メニューからは外せない
ADMIN_IDS = ""
# 渉外フォーラム（Discordのフォーラムチャンネル）のID。承認されたヒアリングのスレッドをここに作る
HEARING_FORUM_ID = ""
# （任意）スレッドに付けるフォーラムのタグID。フォーラムで「タグ必須」にしている場合だけ入れる
HEARING_FORUM_TAG_ID = ""
# 定例の回数：ツールで最初に開いた定例を何回目とするか（Notionの「政策立案部門定例第◯回」に合わせる）
TEIREI_FIRST_NUMBER = "57"
# 定例の議事録を自動で入れるNotionの「議事録」データベース（部門のページの中）と、その回から（それより前の回は何もしない）
NOTION_TEIREI_DB = ""
NOTION_TEIREI_FROM = "57"
# 議事録の「部門」欄に入れる、政策立案部門のNotionページ
NOTION_DEPT_PAGE = ""
# その他のMTGの議事録を入れる、Notionの「部門」の中の「その他」のページ（中の「プロジェクト」欄に、プロジェクトごとのページを作る）
NOTION_OTHER_PAGE = ""

# シークレット（`npx wrangler secret put <NAME>` で設定。コードやログには出さない）:
#   DISCORD_CLIENT_ID / DISCORD_CLIENT_SECRET / SESSION_SECRET
#   DISCORD_BOT_TOKEN（フェーズ1b：アクションボードのBot）

# ---------- テスト版（みんなで試す用。本番とは別のURL・別のDB） ----------
# デプロイ：npx wrangler deploy --env test ／ DBの更新：npx wrangler d1 migrations apply policy-planning-test --remote --env test
# シークレットは本番と別に設定する（--env test）。Discordの開発者ポータルに .../auth/callback のリダイレクトURLを追加しておく
[env.test]
name = "policy-planning-test"

[[env.test.d1_databases]]
binding = "DB"
database_name = "policy-planning-test"
database_id = "<npx wrangler d1 create で出た database_id>"
migrations_dir = "migrations"

# テスト版では、毎朝のリマインドは送らない
[env.test.triggers]
crons = []

[env.test.vars]
# 画面上部に出す帯（本番と見分けるため）
SITE_LABEL = "テスト版"
APP_URL = "https://policy-planning-test.<アカウント>.workers.dev"
DISCORD_GUILD_ID = ""
DEPT_ROLE_ID = ""
HEAD_IDS = ""
REP_IDS = ""
ADMIN_IDS = ""
# テスト版からは渉外フォーラムにスレッドを作らない
HEARING_FORUM_ID = ""
HEARING_FORUM_TAG_ID = ""
